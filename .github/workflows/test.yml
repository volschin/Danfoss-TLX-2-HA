name: Test & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov ruff==0.16.* homeassistant voluptuous

      - name: Compile check
        run: |
          python -m py_compile custom_components/danfoss_tlx/etherlynx.py
          python -m py_compile custom_components/danfoss_tlx/__init__.py
          python -m py_compile custom_components/danfoss_tlx/coordinator.py
          python -m py_compile custom_components/danfoss_tlx/sensor.py
          python -m py_compile custom_components/danfoss_tlx/config_flow.py

      - name: Lint with ruff
        run: ruff check custom_components/ tests/

      - name: Run tests with coverage
        run: pytest --cov=custom_components.danfoss_tlx --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under=95 -v

      - name: Upload results to Codecov
        # Nur bei push (main) — verhindert Secret-Exposition gegenüber PR-gesteuertem Code
        if: github.event_name == 'push'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  minimum-home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install minimum Home Assistant
        run: |
          python -m pip install --upgrade pip
          pip install \
            --constraint https://raw.githubusercontent.com/home-assistant/core/2024.12.0/homeassistant/package_constraints.txt \
            pytest pytest-asyncio pytest-cov \
            "homeassistant==2024.12.0" "josepy<2" voluptuous

      - name: Run minimum-version tests
        run: pytest --cov=custom_components.danfoss_tlx --cov-branch --cov-report=term-missing --cov-fail-under=95 -v
